# Proprietary models, reached through the vendors' CLIs (claude-cli / codex-cli
# adapters). These list prices turn logged token usage into the $/rule column
# (`rulegen report --prices`). Keyed by the model id the CLI resolves (claude's
# `modelUsage`, codex's `-m`); `alias` is what the experiment YAML names. USD per
# million tokens, read off the vendors' pricing pages on `price_date`; a missing
# number stays null rather than guessed.
frontier:
  claude-fable-5-1:
    vendor: anthropic
    cli: claude
    alias: fable
    rung: flagship
    input_per_mtok: 10.0
    cached_input_per_mtok: 0.25
    output_per_mtok: 50.0
    price_date: 2026-09-24
